<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="380" height="250" role="img" aria-label="Velocity-time graph: 0 to 20 m/s in 4 s, constant until 8 s, back to 0 at 10 s">
<title>Velocity-time graph: 0 to 20 m/s in 4 s, constant until 8 s, back to 0 at 10 s</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="380" height="250" fill="#ffffff"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#111827" stroke-linecap="round" stroke-linejoin="round">

<line x1="50" y1="200" x2="369" y2="200" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="50" y1="200" x2="50" y2="32" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ah)"/>
<polygon points="50,200 166,60 282,60 340,200" fill="#c7d2fe" fill-opacity="0.6"/>
<polyline points="50,200 166,60 282,60 340,200" fill="none" stroke="#4338ca" stroke-width="3"/>
<line x1="166" y1="60" x2="166" y2="200" stroke="#6b7280" stroke-dasharray="4 4"/>
<line x1="282" y1="60" x2="282" y2="200" stroke="#6b7280" stroke-dasharray="4 4"/>
<line x1="50" y1="60" x2="166" y2="60" stroke="#6b7280" stroke-dasharray="4 4"/>
<text x="42" y="65" text-anchor="end">20</text>
<text x="42" y="205" text-anchor="end">0</text>
<line x1="166" y1="200" x2="166" y2="205" stroke="#1f2937"/><text x="166" y="220" text-anchor="middle">4</text><line x1="282" y1="200" x2="282" y2="205" stroke="#1f2937"/><text x="282" y="220" text-anchor="middle">8</text><line x1="340" y1="200" x2="340" y2="205" stroke="#1f2937"/><text x="340" y="220" text-anchor="middle">10</text>
<text x="369" y="190" text-anchor="end" font-style="italic">t (s)</text>
<text x="56" y="39" font-style="italic">v (m/s)</text>
</g>
</svg>
