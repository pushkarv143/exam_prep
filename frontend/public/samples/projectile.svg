<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240" role="img" aria-label="Projectile launched at 30 degrees with speed u; maximum height H and range R">
<title>Projectile launched at 30 degrees with speed u; maximum height H and range R</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="380" height="240" fill="#ffffff"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#111827" stroke-linecap="round" stroke-linejoin="round">

<line x1="15" y1="200" x2="365" y2="200" stroke="#1f2937" stroke-width="1.8"/>
<path d="M30,200 Q190,107.6 350,200" fill="none" stroke="#4338ca" stroke-width="2.5" stroke-dasharray="7 5"/>
<line x1="30" y1="200" x2="99.3" y2="160" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="90.6" y="152" fill="#dc2626" font-weight="600">u = 20 m/s</text>
<path d="M72,200 A42,42 0 0,0 66.4,179" fill="none" stroke="#1f2937"/>
<text x="78" y="194" font-size="13">30°</text>
<line x1="190" y1="153.8" x2="190" y2="200" stroke="#059669" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="198" y="181.9" fill="#059669" font-weight="700">H</text>
<line x1="30" y1="222" x2="350" y2="222" stroke="#6b7280" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
<rect x="178" y="212" width="24" height="20" fill="#ffffff"/>
<text x="190" y="227" text-anchor="middle" fill="#4b5563" font-weight="600">R</text>
<text x="20" y="24" font-size="13" fill="#4b5563">Take g = 10 m/s²</text>
</g>
</svg>
