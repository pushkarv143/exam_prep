<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="Energy levels of the hydrogen atom with an electron transition from n = 3 to n = 2">
<title>Energy levels of the hydrogen atom with an electron transition from n = 3 to n = 2</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect width="360" height="240" fill="#ffffff"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#111827" stroke-linecap="round" stroke-linejoin="round">

<line x1="70" y1="210" x2="260" y2="210" stroke="#1f2937" stroke-width="2"/>
<text x="60" y="215" text-anchor="end" font-style="italic">n = 1</text>
<text x="268" y="215" font-size="12" fill="#4b5563">−13.60 eV</text>
<line x1="70" y1="110" x2="260" y2="110" stroke="#1f2937" stroke-width="2"/>
<text x="60" y="115" text-anchor="end" font-style="italic">n = 2</text>
<text x="268" y="115" font-size="12" fill="#4b5563">−3.40 eV</text>
<line x1="70" y1="72" x2="260" y2="72" stroke="#1f2937" stroke-width="2"/>
<text x="60" y="77" text-anchor="end" font-style="italic">n = 3</text>
<text x="268" y="77" font-size="12" fill="#4b5563">−1.51 eV</text>
<line x1="70" y1="52" x2="260" y2="52" stroke="#1f2937" stroke-width="2"/>
<text x="60" y="57" text-anchor="end" font-style="italic">n = 4</text>
<text x="268" y="57" font-size="12" fill="#4b5563">−0.85 eV</text>
<line x1="70" y1="30" x2="260" y2="30" stroke="#1f2937" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="60" y="35" text-anchor="end" font-style="italic">n = ∞</text>
<text x="268" y="35" font-size="12" fill="#4b5563">0 eV</text>
<line x1="170" y1="72" x2="170" y2="108" stroke="#dc2626" stroke-width="3" marker-end="url(#ah)"/>
<path d="M182,91 q8,-8 16,0 t16,0 t16,0" fill="none" stroke="#dc2626" stroke-width="2"/>
<text x="236" y="96" fill="#dc2626" font-weight="700">?</text>
<text x="170" y="234" text-anchor="middle" font-size="12" fill="#4b5563">(not to scale)</text>
</g>
</svg>
