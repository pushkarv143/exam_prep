# Serves the SPA and proxies the API. BACKEND is the docker-compose service name.
upstream backend {
    server backend:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers (the API sets its own).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # API → Spring Boot. It forwards the client IP (used by the rate limiter and the
    # attempt audit log); the backend honours X-Forwarded-* (server.forward-headers-strategy).
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 25m;   # bulk question import
    }

    # Hashed build assets never change, so they are cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side routes (/series/abc, /dashboard) all serve index.html,
    # which must never be cached, so deploys take effect immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
