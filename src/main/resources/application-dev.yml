# Local development: docker-compose infra on localhost, readable logs, sample data.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/devdata
    # Dev data is numbered V1000+, above the schema migrations. A new schema migration (V5, V6, ...)
    # therefore arrives "out of order" on an existing dev database; allow it. Prod never loads devdata.
    out-of-order: true
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.examprep: DEBUG
    org.hibernate.SQL: INFO          # switch to DEBUG to see SQL

management:
  endpoint:
    health:
      show-details: always
