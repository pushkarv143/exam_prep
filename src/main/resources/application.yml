# =====================================================================================
# Base configuration shared by all profiles. Profile files override selectively.
# Every secret / host is overridable through environment variables (12-factor).
# =====================================================================================
spring:
  application:
    name: exam-platform
  profiles:
    default: dev

  threads:
    virtual:
      enabled: true          # Java 21 virtual threads for Tomcat + @Async executors

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/examprep}
    username: ${DB_USERNAME:examprep}
    password: ${DB_PASSWORD:Super@123}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 5000
      pool-name: examprep-hikari

  jpa:
    open-in-view: false      # never lazy-load in the web layer
    hibernate:
      ddl-auto: validate     # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100    # batch inserts (e.g. flushing attempt answers)
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      adminEmail: ${ADMIN_EMAIL:admin@examprep.local}
      adminPassword: ${ADMIN_INITIAL_PASSWORD:Admin@123}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password:
      timeout: 2s
      lettuce:
        pool:
          enabled: false     # Lettuce multiplexes one connection; pooling not needed

  # Caching: see com.examprep.common.cache.CacheConfig (typed per-cache Redis serializers)

  data.web.pageable:
    default-page-size: 20
    max-page-size: 100       # clamp ?size= so a client cannot request the whole table

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB
  forward-headers-strategy: framework   # honour X-Forwarded-* from the load balancer

management:
  health:
    mail:
      enabled: false         # email is async + retried; an SMTP outage must not fail readiness
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ----------------------------------------------------------------------------------
# Application-specific settings (bound to @ConfigurationProperties classes)
# ----------------------------------------------------------------------------------
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  security:
    jwt:
      # Base64-encoded HMAC key, at least 256 bits. MUST be overridden outside dev.
      secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTAxMjM0NTY3ODk=}
      issuer: examprep
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    single-session-enabled: ${SINGLE_SESSION_ENABLED:false}
    password-reset-ttl: 30m
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    enabled: true
  notification:
    email:
      enabled: ${EMAIL_ENABLED:true}
      from: ${MAIL_FROM:ExamPrep <no-reply@examprep.local>}
  storage:
    s3:
      # MinIO locally; leave endpoint empty on AWS (the SDK resolves the regional endpoint).
      endpoint: ${S3_ENDPOINT:http://localhost:9100}
      region: ${S3_REGION:ap-south-1}
      # Empty keys = default AWS credential chain (IAM role / IRSA) in production.
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      bucket: ${S3_BUCKET:examprep}
      # Browser-facing base URL for objects under public/ (CDN in production).
      public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9100/examprep}
      path-style-access: ${S3_PATH_STYLE:true}
      presign-ttl: 15m
  attempt:
    autosave-grace: 15s              # accept the final autosave slightly after the deadline (network latency)
    auto-submit-grace: 30s           # force-submit only after the client had its chance to submit
    max-tab-switches: ${MAX_TAB_SWITCHES:0}   # 0 = unlimited (log only); e.g. 5 = auto-submit on the 6th
    paper-cache-ttl: 6h
    paper-local-ttl: 60s
    auto-submit-concurrency: 16      # keep well below the DB pool size
  evaluation:
    mode: ${EVALUATION_MODE:STREAM}  # STREAM = Redis Stream consumer group; ASYNC = in-process @Async
    concurrency: 16                  # parallel evaluations per instance
    reclaim-idle: 60s                # re-process pending stream messages idle this long
    max-deliveries: 5                # then dead-letter to stream:evaluation:dlq
    sweep-after: 2m                  # DB safety sweep for SUBMITTED-but-never-evaluated attempts
    finalize-delay: 2m               # final ranks this long after a test's end time...
    finalize-force-after: 30m        # ...or at the latest after this, even with stragglers
  payment:
    # MOCK = no network, signatures simulated locally (dev/test). RAZORPAY = real gateway.
    provider: ${PAYMENT_PROVIDER:MOCK}
    brand-name: ExamPrep
    order-reuse-window: 30m
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
