# Production: secrets MUST come from the environment (no defaults for credentials),
# JSON logs for log aggregation, API docs disabled.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:40}
  flyway:
    locations: classpath:db/migration
    placeholders:
      adminEmail: ${ADMIN_EMAIL}
      adminPassword: ${ADMIN_INITIAL_PASSWORD}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      bucket: ${S3_BUCKET}
      public-base-url: ${S3_PUBLIC_BASE_URL}
      path-style-access: ${S3_PATH_STYLE:false}

logging:
  structured:
    format:
      console: ecs                   # Elastic Common Schema JSON lines
  level:
    root: INFO
    com.examprep: INFO

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

management:
  endpoint:
    health:
      show-details: never
